name: Build Windows prototype

on:
  workflow_dispatch:
  push:
    branches: [ "main", "perf/shared-meshes-hud", "feature/world-rain" ]
    paths:
      - "**.cs"
      - "**.gdshader"
      - "Assets/Nature/**"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "*.csproj"
      - "*.sln"
      - "export_presets.cfg"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check water simulation invariants
        run: dotnet run --project Tests/WaterGridChecks/WaterGridChecks.csproj

      - name: Check water across world chunks
        run: dotnet run --project Tests/WorldWaterChecks/WorldWaterChecks.csproj

      - name: Check volumetric terrain and save invariants
        run: dotnet run --project Tests/VolumeChecks/VolumeChecks.csproj

      - name: Install Godot .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Build C# solution
        run: |
          dotnet build TheNorloland.csproj -c Debug
          godot --headless --editor --path . --build-solutions --quit --verbose

      - name: Print MSBuild diagnostics on failure
        if: failure()
        run: cat /home/runner/.local/share/godot/mono/build_logs/*_Debug/msbuild_log.txt

      - name: Smoke test normal world startup
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . --quit-after 20 2>&1 | tee world-startup.log
          ! grep -E 'SCRIPT ERROR|error CS[0-9]+|Unhandled exception' world-startup.log

      - name: Render snow in the normal world
        run: |
          set -o pipefail
          timeout 300s xvfb-run -a godot --path . --rendering-method gl_compatibility --fixed-fps 30 -- --snow-capture 2>&1 | tee snow-capture.log
          ! grep -E 'SCRIPT ERROR|Shader compilation failed|error CS[0-9]+|Unhandled exception' snow-capture.log
          test -f build/snow-world.png

      - name: Upload snow world capture
        uses: actions/upload-artifact@v4
        with:
          name: Snow-World-Preview
          path: build/snow-world.png
          if-no-files-found: error
          retention-days: 14

      - name: Export Windows build
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --export-release "Windows Desktop" build/TheNorloland.exe 2>&1 | tee build/windows-export.log
          ! grep -E 'ERROR: Export .NET Project|C# file but no solution|error CS[0-9]+' build/windows-export.log
          test -f build/data_TheNorloland_windows_x86_64/TheNorloland.dll

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TheNorloland-Windows
          path: |
            build/TheNorloland.exe
            build/TheNorloland.pck
            build/data_TheNorloland_windows_x86_64/
          if-no-files-found: error
          retention-days: 14

      - name: Render ten-second landscape demo
        if: github.event_name == 'workflow_dispatch'
        run: |
          timeout 900s xvfb-run -a godot --path . --rendering-method gl_compatibility --fixed-fps 15 -- --landscape-demo
          ffmpeg -y -framerate 15 -i build/landscape-frames/%04d.png -t 10 -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart build/norloland-landscape-10s.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 build/norloland-landscape-10s.mp4

      - name: Upload landscape demo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-Demo-10s
          path: build/norloland-landscape-10s.mp4
          if-no-files-found: error
          retention-days: 14


      - name: Preserve capture diagnostics on failure
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-Capture-Diagnostics
          path: build/landscape-frames/
          if-no-files-found: warn
          retention-days: 3

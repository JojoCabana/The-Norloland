name: Build Windows prototype

on:
  workflow_dispatch:
  push:
    branches: [ "main", "perf/shared-meshes-hud" ]
    paths:
      - "**.cs"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "*.csproj"
      - "export_presets.cfg"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check water simulation invariants
        run: dotnet run --project Tests/WaterGridChecks/WaterGridChecks.csproj

      - name: Install Godot .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Build C# solution
        run: godot --headless --editor --path . --build-solutions --quit --verbose

      - name: Print MSBuild diagnostics on failure
        if: failure()
        run: cat /home/runner/.local/share/godot/mono/build_logs/*_Debug/msbuild_log.txt

      - name: Export Windows build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/TheNorloland.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TheNorloland-Windows
          path: |
            build/TheNorloland.exe
            build/TheNorloland.pck
          if-no-files-found: error
          retention-days: 14

name: Import existing nature assets
on:
  push:
    branches: [perf/shared-meshes-hud]
    paths: [.github/workflows/import-nature.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/shared-meshes-hud
      - name: Download approved reference package
        run: |
          curl --fail --location 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-bda0-8246-beba-eef3ceb6fbcb/raw?se=2026-10-27T16%3A19%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=1f210461-3aa0-42f3-afef-9959c94053d3&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A07%3A30Z&ske=2026-10-28T12%3A07%3A30Z&sks=b&skv=2026-02-06&sig=mfpl8jWoVTl0csTih3BdoSFDo4MXNWf3niAQEqcGNeU%3D' -o /tmp/reference.zip
          mkdir -p /tmp/reference
          unzip -q /tmp/reference.zip -d /tmp/reference
          mkdir -p Assets/Nature
          cp -r /tmp/reference/assets/. Assets/Nature/
          find Assets/Nature -name '*.import' -delete
          cp /tmp/reference/ASSET_CREDITS.md Assets/Nature/ASSET_CREDITS.md
          cp /tmp/reference/grass.gdshader Shaders/nature_grass.gdshader
          cp /tmp/reference/terrain.gdshader Shaders/nature_terrain.gdshader
      - name: Save imported models and materials
        run: |
          git config user.name 'Norloland Build'
          git config user.email 'norloland-build@users.noreply.github.com'
          git add Assets/Nature Shaders/nature_grass.gdshader Shaders/nature_terrain.gdshader
          git commit -m "Import existing CC0 nature assets and shaders from 3dspiel"
          git push origin HEAD:perf/shared-meshes-hud
